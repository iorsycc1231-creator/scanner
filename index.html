<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>現金精算アプリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f0f4f8;min-height:100vh;font-size:14px}

/* ナビ */
nav{background:#1c1917;color:#fff;padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:700;padding:14px 0;margin-right:16px}
.tab{padding:14px 12px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;color:#9ca3af}
.tab.on{color:#fff;border-bottom-color:#16a34a}

/* レイアウト */
.wrap{max-width:800px;margin:0 auto;padding:20px 16px 80px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-t{font-size:15px;font-weight:700;margin-bottom:16px}

/* フォーム */
label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px;margin-top:12px}
label:first-child{margin-top:0}
input,select{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none}

/* ボタン */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center}
.btn-g{background:#16a34a;color:#fff}
.btn-w{background:#f3f4f6;color:#374151}
.btn-sm{display:inline-block;width:auto;padding:6px 14px;font-size:12px;margin-top:0}

/* アップロード */
.upload{border:2px dashed #d1d5db;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;margin-bottom:0}
.pimg{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:12px}

/* 明細行 */
.irow{background:#f9fafb;border-radius:8px;padding:12px;margin-bottom:8px}
.itop{display:flex;justify-content:space-between;margin-bottom:6px}
.iname{font-weight:600}
.iamt{font-weight:700;color:#16a34a}
.tax-tag{background:#dbeafe;color:#2563eb;border-radius:4px;padding:2px 8px;font-size:11px;display:inline-block;margin-bottom:6px}
.iac{width:100%;padding:6px 8px;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;margin-top:4px;font-family:inherit}

/* 精算方法 */
.mwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:14px;border:2px solid #e5e7eb;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.mbtn.sel-now{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
.mbtn.sel-later{border-color:#d97706;background:#fffbeb;color:#d97706}

/* サイン */
#cvs{border:2px solid #e5e7eb;border-radius:8px;width:100%;touch-action:none;cursor:crosshair;background:#fafafa;display:block}

/* 合計 */
.totrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.totbox{background:#f9fafb;border-radius:8px;padding:12px;margin-top:8px}

/* 申請ID */
.idbox{background:#1c1917;color:#fff;border-radius:10px;padding:16px;text-align:center;margin-bottom:16px}
.idbox .lbl{font-size:11px;color:#9ca3af;margin-bottom:6px}
.idbox .val{font-size:22px;font-weight:700;letter-spacing:2px}

/* 一覧 */
.li{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.lirow{display:flex;justify-content:space-between;align-items:center}
.st-done{background:#dcfce7;color:#16a34a;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.st-pend{background:#fef3c7;color:#d97706;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.sc{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* モーダル */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:500px;margin:0 auto;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}

/* テーブル */
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.tbl th{background:#f3f4f6;padding:8px;text-align:left;border:1px solid #e5e7eb;font-weight:600}
.tbl td{padding:8px;border:1px solid #e5e7eb}
hr{border:none;border-top:1px solid #e5e7eb;margin:12px 0}

/* ローディング */
.loading{text-align:center;padding:40px;color:#6b7280}
.spin{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#16a34a;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 完了 */
.done-hero{text-align:center;padding:40px 0 24px}
.done-icon{font-size:64px;margin-bottom:16px}
.done-title{font-size:22px;font-weight:700;color:#16a34a;margin-bottom:6px}
.done-sub{font-size:14px;color:#6b7280}
.next-box{background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:24px;text-align:center;margin-top:8px}

/* 確認画面 */
.conf-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.conf-label{color:#6b7280}
.conf-val{font-weight:600;text-align:right}

/* 非表示 */
.hide{display:none}
</style>
</head>
<body>

<!-- ナビ -->
<nav>
  <div class="logo">💴 現金精算</div>
  <div class="tab on" id="tab-apply" onclick="switchTab('apply')">申請</div>
  <div class="tab" id="tab-client" onclick="switchTab('client')">顧問先</div>
  <div class="tab" id="tab-acct" onclick="switchTab('acct')">会計事務所</div>
</nav>

<!-- ===== 申請ページ ===== -->
<div id="page-apply" class="wrap">

  <!-- 画面1: アップロード -->
  <div id="screen-upload">
    <div class="card">
      <div class="card-t">📷 レシートをアップロード</div>
      <div class="upload" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept="image/*" style="display:none"/>
        <div style="font-size:40px;margin-bottom:10px">🧾</div>
        <div style="font-weight:700;font-size:15px;margin-bottom:4px">タップして選択</div>
        <div style="font-size:12px;color:#9ca3af">JPG・PNG・HEIC対応</div>
      </div>
      <div id="preview-wrap" class="hide"><img id="preview-img" class="pimg"/></div>
      <button class="btn btn-g hide" id="btn-analyze">🔍 AIで解析する</button>
    </div>
  </div>

  <!-- 画面2: フォーム -->
  <div id="screen-form" class="hide">
    <div class="card">
      <div class="card-t">📋 解析結果・編集</div>
      <label>精算者</label>
      <select id="f-person"><option>田中</option><option>佐藤</option><option>大橋</option></select>
      <label>支払先（店名）</label>
      <input type="text" id="f-store"/>
      <label>日付</label>
      <input type="date" id="f-date"/>
      <label>インボイス番号</label>
      <input type="text" id="f-invoice" placeholder="T123456789012（なければ空欄）"/>
      <div style="margin-top:16px;font-weight:700;font-size:14px;margin-bottom:8px">明細・勘定科目</div>
      <div id="items-area"></div>
      <div class="totbox">
        <div class="totrow"><span style="color:#6b7280">消費税(8%)</span><span id="show-tax8">—</span></div>
        <div class="totrow"><span style="color:#6b7280">消費税(10%)</span><span id="show-tax10">—</span></div>
        <div class="totrow"><span style="font-weight:700">合計</span><span id="show-total" style="font-weight:700;font-size:17px;color:#dc2626">—</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-t">💰 精算方法を選択</div>
      <div class="mwrap">
        <button class="mbtn" id="mbtn-now" onclick="selectMethod('now')">今すぐ精算</button>
        <button class="mbtn" id="mbtn-later" onclick="selectMethod('later')">後で精算</button>
      </div>
    </div>

    <div class="card hide" id="sign-card">
      <div class="card-t">✍️ 電子サイン</div>
      <p style="font-size:12px;color:#6b7280;margin-bottom:10px">指またはマウスで署名してください</p>
      <canvas id="cvs" height="160"></canvas>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button onclick="clearSign()" style="padding:6px 12px;background:#f3f4f6;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600">クリア</button>
        <span id="sign-done-label" class="hide" style="font-size:12px;color:#16a34a;font-weight:600">✓ 署名済み</span>
      </div>
    </div>

    <button class="btn btn-g hide" id="btn-to-confirm">申請内容を確認する →</button>
  </div>

  <!-- 画面3: 確認 -->
  <div id="screen-confirm" class="hide">
    <div class="card">
      <div class="card-t">📋 申請内容の確認</div>
      <div id="confirm-area"></div>
    </div>
    <button class="btn btn-g" id="btn-submit" onclick="doSubmit()">送信する</button>
    <button class="btn btn-w" onclick="showScreen('form')">← 戻って修正する</button>
  </div>

  <!-- 画面4: 完了 -->
  <div id="screen-done" class="hide">
    <div class="done-hero">
      <div class="done-icon">✅</div>
      <div class="done-title">申請ありがとうございました</div>
      <div class="done-sub">内容を確認の上、処理いたします</div>
    </div>
    <div id="done-status" style="margin-bottom:12px"></div>
    <div class="idbox">
      <div class="lbl">申請ID</div>
      <div class="val" id="done-id">—</div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:10px">申請内容</div>
      <div id="done-summary"></div>
    </div>
    <p style="font-size:12px;color:#9ca3af;text-align:center;margin:16px 0">📝 レシート束の先頭に申請IDを手書きで記載してください</p>
    <div class="next-box">
      <div style="font-size:15px;font-weight:700;color:#16a34a;margin-bottom:6px">続けて申請できます</div>
      <div style="font-size:13px;color:#6b7280;margin-bottom:16px">新しいレシートがあればこちらから</div>
      <button class="btn btn-g" onclick="resetApply()">＋ 新しい申請はこちらから</button>
    </div>
  </div>

</div><!-- /page-apply -->

<!-- ===== 顧問先ページ ===== -->
<div id="page-client" class="wrap hide">
  <div class="sg">
    <div class="sc"><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">今月の支出</div><div style="font-size:22px;font-weight:700;color:#dc2626" id="c-total">¥0</div></div>
    <div class="sc"><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">未精算件数</div><div style="font-size:22px;font-weight:700" id="c-pending">0件</div></div>
  </div>
  <div class="card"><div class="card-t">📋 申請一覧</div><div id="client-list"></div></div>
</div>

<!-- ===== 会計事務所ページ ===== -->
<div id="page-acct" class="wrap hide">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="card-t" style="margin-bottom:0">申請一覧</div>
      <button onclick="downloadCSV()" style="background:#2563eb;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">⬇ CSV出力</button>
    </div>
    <div id="acct-list"></div>
  </div>
</div>

<!-- ===== 詳細モーダル ===== -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <span style="font-size:17px;font-weight:700">申請詳細</span>
      <button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6b7280;line-height:1">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ========== 状態 ==========
var APPS = JSON.parse(localStorage.getItem('apps') || '[]');
var CUR_DATA = null;   // AI解析結果
var CUR_METHOD = null; // 'now' or 'later'
var CUR_B64 = null;
var CUR_MIME = null;
var SIGN_DONE = false;
var IS_DRAWING = false;
var SUBMITTED = false; // 二重送信防止

var ACCOUNTS = ['会議費','交際費','旅費交通費','消耗品費','事務用品費','通信費','新聞図書費','厚生費','雑費'];
var ACC_MAP = {
  '弁当':'会議費','サンドイッチ':'会議費','おにぎり':'会議費','寿司':'会議費',
  'お茶':'厚生費','コーヒー':'厚生費','飲料':'厚生費','ジュース':'厚生費',
  'ティッシュ':'消耗品費','洗剤':'消耗品費','文具':'事務用品費','ボールペン':'事務用品費','ノート':'事務用品費',
  '電車':'旅費交通費','バス':'旅費交通費','タクシー':'旅費交通費','新幹線':'旅費交通費',
  '切手':'通信費','宅配':'通信費','書籍':'新聞図書費','雑誌':'新聞図書費'
};

function guessAccount(name) {
  for (var k in ACC_MAP) {
    if (name.indexOf(k) >= 0) return ACC_MAP[k];
  }
  return '雑費';
}

function generateId() {
  var d = new Date();
  var ym = d.getFullYear() + '' + ('0' + (d.getMonth() + 1)).slice(-2);
  var seq = ('000000' + (APPS.length + 1)).slice(-6);
  return 'CS-' + ym + '-' + seq;
}

function saveApps() {
  localStorage.setItem('apps', JSON.stringify(APPS));
}

// ========== タブ切替 ==========
function switchTab(id) {
  ['apply','client','acct'].forEach(function(p) {
    var page = document.getElementById('page-' + p);
    var tab = document.getElementById('tab-' + p);
    if (p === id) {
      page.classList.remove('hide');
      tab.classList.add('on');
    } else {
      page.classList.add('hide');
      tab.classList.remove('on');
    }
  });
  if (id === 'client') renderClient();
  if (id === 'acct') renderAcct();
}

// ========== 申請フロー画面切替 ==========
function showScreen(name) {
  ['upload','form','confirm','done'].forEach(function(s) {
    document.getElementById('screen-' + s).classList.add('hide');
  });
  document.getElementById('screen-' + name).classList.remove('hide');
  window.scrollTo(0, 0);
}

// ========== ファイル選択 ==========
document.getElementById('file-input').addEventListener('change', function() {
  var file = this.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  CUR_MIME = file.type;
  var reader = new FileReader();
  reader.onload = function(e) {
    CUR_B64 = e.target.result.split(',')[1];
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('preview-wrap').classList.remove('hide');
    document.getElementById('btn-analyze').classList.remove('hide');
  };
  reader.readAsDataURL(file);
});

// ========== AI解析 ==========
document.getElementById('btn-analyze').addEventListener('click', function() {
  if (!CUR_B64) return;
  showScreen('upload');
  document.getElementById('screen-upload').innerHTML =
    '<div class="loading"><div class="spin"></div><div>Claudeが解析中…</div></div>';

  fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: CUR_B64, mimeType: CUR_MIME })
  })
  .then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || r.status); });
    return r.json();
  })
  .then(function(data) {
    CUR_DATA = data;
    buildForm();
    showScreen('form');
  })
  .catch(function(e) {
    document.getElementById('screen-upload').innerHTML =
      '<div class="card"><div class="card-t" style="color:#dc2626">⚠ 解析エラー</div>' +
      '<p style="font-size:13px;color:#6b7280;margin-bottom:12px">' + e.message + '</p>' +
      '<button class="btn btn-w" onclick="resetApply()">やり直す</button></div>';
  });
});

// ========== フォーム構築 ==========
function buildForm() {
  document.getElementById('f-store').value = CUR_DATA.store_name || '';
  document.getElementById('f-date').value = CUR_DATA.date || '';
  document.getElementById('f-invoice').value = CUR_DATA.invoice_number || '';
  document.getElementById('show-tax8').textContent = CUR_DATA.tax_8 != null ? '¥' + CUR_DATA.tax_8.toLocaleString() : '—';
  document.getElementById('show-tax10').textContent = CUR_DATA.tax_10 != null ? '¥' + CUR_DATA.tax_10.toLocaleString() : '—';
  document.getElementById('show-total').textContent = CUR_DATA.total != null ? '¥' + CUR_DATA.total.toLocaleString() : '—';

  var area = document.getElementById('items-area');
  area.innerHTML = '';
  (CUR_DATA.items || []).forEach(function(item, i) {
    var ac = guessAccount(item.name);
    var opts = ACCOUNTS.map(function(a) {
      return '<option' + (a === ac ? ' selected' : '') + '>' + a + '</option>';
    }).join('');
    area.innerHTML +=
      '<div class="irow">' +
        '<div class="itop"><span class="iname">' + item.name + '</span><span class="iamt">¥' + Number(item.amount || 0).toLocaleString() + '</span></div>' +
        '<span class="tax-tag">' + (item.tax_category || '不明') + '</span>' +
        '<select class="iac" id="ac-' + i + '">' + opts + '</select>' +
      '</div>';
  });

  // リセット
  CUR_METHOD = null;
  SIGN_DONE = false;
  SUBMITTED = false;
  document.getElementById('mbtn-now').className = 'mbtn';
  document.getElementById('mbtn-later').className = 'mbtn';
  document.getElementById('sign-card').classList.add('hide');
  document.getElementById('btn-to-confirm').classList.add('hide');
}

// ========== 精算方法選択 ==========
function selectMethod(m) {
  CUR_METHOD = m;
  document.getElementById('mbtn-now').className = 'mbtn' + (m === 'now' ? ' sel-now' : '');
  document.getElementById('mbtn-later').className = 'mbtn' + (m === 'later' ? ' sel-later' : '');
  if (m === 'now') {
    document.getElementById('sign-card').classList.remove('hide');
    initCanvas();
  } else {
    document.getElementById('sign-card').classList.add('hide');
  }
  document.getElementById('btn-to-confirm').classList.remove('hide');
}

// ========== 電子サイン ==========
function initCanvas() {
  var cv = document.getElementById('cvs');
  cv.width = cv.parentElement.offsetWidth - 40;
  SIGN_DONE = false;
  document.getElementById('sign-done-label').classList.add('hide');
  var ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#1c1917';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';

  function getPos(e) {
    var r = cv.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  cv.onmousedown = cv.ontouchstart = function(e) {
    e.preventDefault();
    IS_DRAWING = true;
    var p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  cv.onmousemove = cv.ontouchmove = function(e) {
    e.preventDefault();
    if (!IS_DRAWING) return;
    var p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    SIGN_DONE = true;
    document.getElementById('sign-done-label').classList.remove('hide');
  };
  cv.onmouseup = cv.ontouchend = function() { IS_DRAWING = false; };
}

function clearSign() {
  var cv = document.getElementById('cvs');
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  SIGN_DONE = false;
  document.getElementById('sign-done-label').classList.add('hide');
}

// ========== 確認画面へ ==========
document.getElementById('btn-to-confirm').addEventListener('click', function() {
  if (!CUR_METHOD) { alert('精算方法を選択してください'); return; }
  if (CUR_METHOD === 'now' && !SIGN_DONE) { alert('電子サインを記入してください'); return; }

  var person = document.getElementById('f-person').value;
  var store = document.getElementById('f-store').value;
  var date = document.getElementById('f-date').value;
  var invoice = document.getElementById('f-invoice').value;
  var total = CUR_DATA.total;
  var methodLabel = CUR_METHOD === 'now' ? '今すぐ精算' : '後で精算';

  var itemsHtml = '';
  (CUR_DATA.items || []).forEach(function(item, i) {
    var el = document.getElementById('ac-' + i);
    var ac = el ? el.value : '雑費';
    itemsHtml +=
      '<div class="conf-row">' +
        '<span class="conf-label">' + item.name + '</span>' +
        '<span class="conf-val">' + ac + '　¥' + Number(item.amount || 0).toLocaleString() + '</span>' +
      '</div>';
  });

  document.getElementById('confirm-area').innerHTML =
    '<div class="conf-row"><span class="conf-label">申請者</span><span class="conf-val">' + person + '</span></div>' +
    '<div class="conf-row"><span class="conf-label">支払先</span><span class="conf-val">' + (store || '—') + '</span></div>' +
    '<div class="conf-row"><span class="conf-label">日付</span><span class="conf-val">' + (date || '—') + '</span></div>' +
    '<div class="conf-row"><span class="conf-label">インボイス番号</span><span class="conf-val">' + (invoice || 'なし') + '</span></div>' +
    '<div class="conf-row"><span class="conf-label">精算方法</span><span class="conf-val">' + methodLabel + '</span></div>' +
    '<hr/>' +
    itemsHtml +
    '<div class="conf-row" style="margin-top:4px"><span class="conf-label" style="font-weight:700">合計</span><span class="conf-val" style="font-size:17px;color:#dc2626">' + (total != null ? '¥' + total.toLocaleString() : '—') + '</span></div>';

  SUBMITTED = false;
  showScreen('confirm');
});

// ========== 送信 ==========
function doSubmit() {
  if (SUBMITTED) return;
  SUBMITTED = true;
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '送信中…';

  var items = (CUR_DATA.items || []).map(function(item, i) {
    var el = document.getElementById('ac-' + i);
    return {
      name: item.name,
      amount: item.amount,
      tax_category: item.tax_category,
      account: el ? el.value : '雑費'
    };
  });

  var signData = null;
  if (CUR_METHOD === 'now') {
    try { signData = document.getElementById('cvs').toDataURL(); } catch(e) {}
  }

  var app = {
    id: generateId(),
    date: document.getElementById('f-date').value,
    person: document.getElementById('f-person').value,
    store: document.getElementById('f-store').value,
    invoice: document.getElementById('f-invoice').value,
    items: items,
    tax_8: CUR_DATA.tax_8,
    tax_10: CUR_DATA.tax_10,
    total: CUR_DATA.total,
    method: CUR_METHOD,
    status: CUR_METHOD === 'now' ? '精算済' : '未精算',
    sign: signData,
    img: CUR_B64 ? ('data:' + CUR_MIME + ';base64,' + CUR_B64) : null,
    created: new Date().toISOString()
  };

  APPS.push(app);
  saveApps();
  renderDone(app);
  var btn2 = document.getElementById('btn-submit');
  if (btn2) { btn2.disabled = false; btn2.textContent = '送信する'; }
  showScreen('done');
}

// ========== 完了画面 ==========
function renderDone(app) {
  document.getElementById('done-id').textContent = app.id;
  document.getElementById('done-status').innerHTML = app.status === '精算済'
    ? '<div style="background:#dcfce7;color:#16a34a;border-radius:8px;padding:12px;text-align:center;font-weight:600">✓ 今すぐ精算済みとして記録されました</div>'
    : '<div style="background:#fef3c7;color:#d97706;border-radius:8px;padding:12px;text-align:center;font-weight:600">⏳ 未精算として記録されました</div>';
  document.getElementById('done-summary').innerHTML =
    '<div class="totrow"><span style="color:#6b7280">申請者</span><b>' + app.person + '</b></div>' +
    '<div class="totrow"><span style="color:#6b7280">支払先</span><b>' + (app.store || '—') + '</b></div>' +
    '<div class="totrow"><span style="color:#6b7280">日付</span><b>' + (app.date || '—') + '</b></div>' +
    '<div class="totrow"><span style="color:#6b7280">明細</span><b>' + app.items.length + '件</b></div>' +
    '<div class="totrow"><span style="color:#6b7280">合計</span><b style="color:#dc2626;font-size:17px">' + (app.total != null ? '¥' + app.total.toLocaleString() : '—') + '</b></div>';
}

// ========== リセット ==========
function resetApply() {
  CUR_DATA = null;
  CUR_METHOD = null;
  CUR_B64 = null;
  CUR_MIME = null;
  SIGN_DONE = false;
  SUBMITTED = false;
  // アップロード画面を元に戻す
  document.getElementById('screen-upload').innerHTML =
    '<div class="card">' +
    '<div class="card-t">📷 レシートをアップロード</div>' +
    '<div class="upload" onclick="document.getElementById(\'fi2\').click()">' +
    '<input type="file" id="fi2" accept="image/*" style="display:none"/>' +
    '<div style="font-size:40px;margin-bottom:10px">🧾</div>' +
    '<div style="font-weight:700;font-size:15px;margin-bottom:4px">タップして選択</div>' +
    '<div style="font-size:12px;color:#9ca3af">JPG・PNG・HEIC対応</div></div>' +
    '<div id="preview-wrap" class="hide"><img id="preview-img" class="pimg"/></div>' +
    '<button class="btn btn-g hide" id="btn-analyze2">🔍 AIで解析する</button>' +
    '</div>';

  document.getElementById('fi2').addEventListener('change', function() {
    var file = this.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    CUR_MIME = file.type;
    var reader = new FileReader();
    reader.onload = function(e) {
      CUR_B64 = e.target.result.split(',')[1];
      document.getElementById('preview-img').src = e.target.result;
      document.getElementById('preview-wrap').classList.remove('hide');
      document.getElementById('btn-analyze2').classList.remove('hide');
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btn-analyze2').addEventListener('click', function() {
    if (!CUR_B64) return;
    document.getElementById('screen-upload').innerHTML =
      '<div class="loading"><div class="spin"></div><div>Claudeが解析中…</div></div>';
    fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: CUR_B64, mimeType: CUR_MIME })
    })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || r.status); });
      return r.json();
    })
    .then(function(data) {
      CUR_DATA = data;
      buildForm();
      showScreen('form');
    })
    .catch(function(e) {
      document.getElementById('screen-upload').innerHTML =
        '<div class="card"><div class="card-t" style="color:#dc2626">⚠ エラー</div>' +
        '<p style="font-size:13px;color:#6b7280;margin-bottom:12px">' + e.message + '</p>' +
        '<button class="btn btn-w" onclick="resetApply()">やり直す</button></div>';
    });
  });

  showScreen('upload');
}

// ========== 顧問先 ==========
function renderClient() {
  var total = APPS.reduce(function(s, a) { return s + (a.total || 0); }, 0);
  var pend = APPS.filter(function(a) { return a.status === '未精算'; }).length;
  document.getElementById('c-total').textContent = '¥' + total.toLocaleString();
  document.getElementById('c-pending').textContent = pend + '件';
  var el = document.getElementById('client-list');
  if (!APPS.length) { el.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:24px">申請はありません</p>'; return; }
  el.innerHTML = APPS.slice().reverse().map(function(a) {
    return '<div class="li" onclick="showDetail(\'' + a.id + '\')">' +
      '<div class="lirow">' +
        '<div><div style="font-size:12px;color:#9ca3af">' + a.date + '　' + a.store + '</div>' +
        '<div style="font-weight:600;margin-top:2px">' + a.person + '</div></div>' +
        '<div style="text-align:right"><div style="font-weight:700;color:#dc2626;font-size:16px">-¥' + (a.total || 0).toLocaleString() + '</div>' +
        '<span class="' + (a.status === '精算済' ? 'st-done' : 'st-pend') + '">' + a.status + '</span></div>' +
      '</div>' +
      '<div style="font-size:11px;color:#9ca3af;margin-top:6px">' + a.id + '</div>' +
    '</div>';
  }).join('');
}

// ========== 会計事務所 ==========
function renderAcct() {
  var el = document.getElementById('acct-list');
  if (!APPS.length) { el.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:24px">申請はありません</p>'; return; }
  el.innerHTML = APPS.slice().reverse().map(function(a) {
    return '<div class="li" onclick="showDetail(\'' + a.id + '\')">' +
      '<div class="lirow">' +
        '<div><div style="font-size:12px;color:#9ca3af">' + a.date + '</div>' +
        '<div style="font-weight:600;margin-top:2px">' + a.person + '　' + a.store + '</div></div>' +
        '<div style="text-align:right"><div style="font-weight:700;color:#dc2626;font-size:16px">¥' + (a.total || 0).toLocaleString() + '</div>' +
        '<span class="' + (a.status === '精算済' ? 'st-done' : 'st-pend') + '">' + a.status + '</span></div>' +
      '</div>' +
      '<div style="font-size:11px;color:#9ca3af;margin-top:6px">' + a.id + '　' + (a.items || []).length + '件</div>' +
    '</div>';
  }).join('');
}

// ========== 詳細モーダル ==========
function showDetail(id) {
  var a = APPS.find(function(x) { return x.id === id; });
  if (!a) return;
  var rows = (a.items || []).map(function(it) {
    return '<tr><td>' + it.name + '</td><td>' + (it.account || '—') + '</td><td>' + (it.tax_category || '—') + '</td><td style="text-align:right">¥' + Number(it.amount || 0).toLocaleString() + '</td></tr>';
  }).join('');
  document.getElementById('modal-body').innerHTML =
    '<div class="idbox"><div class="lbl">申請ID</div><div class="val">' + a.id + '</div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:13px">' +
      '<div><span style="color:#9ca3af">申請者</span><br><b>' + a.person + '</b></div>' +
      '<div><span style="color:#9ca3af">日付</span><br><b>' + a.date + '</b></div>' +
      '<div><span style="color:#9ca3af">支払先</span><br><b>' + (a.store || '—') + '</b></div>' +
      '<div><span style="color:#9ca3af">インボイス</span><br><b>' + (a.invoice || 'なし') + '</b></div>' +
    '</div>' +
    '<table class="tbl"><thead><tr><th>商品名</th><th>勘定科目</th><th>税区分</th><th>金額</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="text-align:right;margin-top:8px;font-size:15px;font-weight:700">合計: ¥' + (a.total || 0).toLocaleString() + '</div>' +
    (a.sign && a.sign.startsWith('data:') ? '<hr/><div style="font-size:12px;font-weight:600;color:#6b7280;margin-bottom:8px">電子サイン</div><img src="' + a.sign + '" style="border:1px solid #e5e7eb;border-radius:8px;width:100%;max-height:120px;object-fit:contain"/>' : '') +
    (a.img ? '<hr/><div style="font-size:12px;font-weight:600;color:#6b7280;margin-bottom:8px">レシート画像</div><img src="' + a.img + '" style="width:100%;border-radius:8px"/>' : '') +
    (a.status === '未精算' ? '<button class="btn btn-g" style="margin-top:4px" onclick="completePay(\'' + a.id + '\')">現金精算を完了する</button>' : '');
  document.getElementById('modal-bg').style.display = 'block';
}

function closeModal() { document.getElementById('modal-bg').style.display = 'none'; }

function completePay(id) {
  var a = APPS.find(function(x) { return x.id === id; });
  if (!a) return;
  a.status = '精算済';
  saveApps();
  closeModal();
  renderClient();
  renderAcct();
  alert('精算完了しました');
}

// ========== CSV出力 ==========
function downloadCSV() {
  if (!APPS.length) { alert('申請データがありません'); return; }
  function esc(v) {
    var s = String(v == null ? '' : v);
    return (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  var rows = [['日付', '摘要', '出金', '入金', '申請ID', '申請者', 'インボイス番号']];
  APPS.forEach(function(a) {
    (a.items || []).forEach(function(it) {
      var summary = (it.account || '雑費') + '｜' + it.name + '｜' + (a.store || '');
      rows.push([a.date, summary, it.amount || 0, '', a.id, a.person, a.invoice || '']);
    });
  });
  var csv = '\uFEFF' + rows.map(function(r) { return r.map(esc).join(','); }).join('\n');
  var link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  link.download = '現金出納帳_' + new Date().toISOString().slice(0, 10) + '.csv';
  link.click();
}
</script>
