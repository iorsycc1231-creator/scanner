<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>現金精算アプリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f0f4f8;min-height:100vh;font-size:14px}
nav{background:#1c1917;color:#fff;padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.nav-logo{font-size:15px;font-weight:700;padding:14px 0;margin-right:16px}
.nav-tab{padding:14px 14px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;color:#9ca3af;transition:all .2s}
.nav-tab.active{color:#fff;border-bottom-color:#16a34a}
.page{display:none;padding:20px 16px 80px;max-width:800px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;color:#1c1917}
label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px;margin-top:12px}
label:first-child{margin-top:0}
input,select{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border .2s}
input:focus,select:focus{border-color:#16a34a}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-blue{background:#2563eb;color:#fff}.btn-blue:hover{background:#1d4ed8}
.btn-gray{background:#f3f4f6;color:#374151}.btn-gray:hover{background:#e5e7eb}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%;margin-top:12px}
.upload-zone{border:2px dashed #d1d5db;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.drag{border-color:#16a34a;background:#f0fdf4}
.preview-img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:12px}
#sign-canvas{border:2px solid #e5e7eb;border-radius:8px;width:100%;touch-action:none;cursor:crosshair;background:#fafafa}
.item-row{background:#f9fafb;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid #f3f4f6}
.item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge-blue{background:#dbeafe;color:#2563eb;border-radius:4px;padding:2px 8px;font-size:11px}
.loading{text-align:center;padding:32px;color:#6b7280}
.spinner{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#16a34a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.app-id-box{background:#1c1917;color:#fff;border-radius:8px;padding:16px;text-align:center;margin-bottom:16px}
.app-id-box .label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.app-id-box .id{font-size:22px;font-weight:700;letter-spacing:2px}
.list-item{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.list-header{display:flex;justify-content:space-between;align-items:center}
.list-amount{font-weight:700;color:#dc2626;font-size:16px}
.status-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.status-pending{background:#fef3c7;color:#d97706}
.status-done{background:#dcfce7;color:#16a34a}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.summary-card{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.summary-label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.summary-value{font-size:22px;font-weight:700}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:20px 16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;padding:24px;margin:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.csv-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.csv-table th{background:#f3f4f6;padding:8px;text-align:left;font-weight:600;border:1px solid #e5e7eb}
.csv-table td{padding:8px;border:1px solid #e5e7eb}
.success-box{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:24px;text-align:center}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">💴 現金精算</div>
  <div class="nav-tab active" onclick="showPage('apply',this)">申請</div>
  <div class="nav-tab" onclick="showPage('client',this)">顧問先</div>
  <div class="nav-tab" onclick="showPage('accounting',this)">会計事務所</div>
</nav>

<!-- 申請 -->
<div class="page active" id="page-apply">
  <div class="card" id="step1">
    <div class="card-title">📷 レシートをアップロード</div>
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="event.preventDefault();this.classList.remove('drag');handleFile(event.dataTransfer.files[0])">
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this.files[0])"/>
      <div style="font-size:36px;margin-bottom:8px">🧾</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">タップして選択</div>
      <div style="font-size:12px;color:#9ca3af">JPG・PNG・HEIC対応</div>
    </div>
    <div id="preview-wrap" style="display:none"><img id="preview" class="preview-img"/></div>
    <button class="btn btn-green btn-full" id="analyze-btn" style="display:none" onclick="analyzeReceipt()">🔍 AIで解析する</button>
  </div>

  <div id="step2" style="display:none">
    <div class="card">
      <div class="card-title">📋 解析結果・編集</div>
      <label>精算者</label>
      <select id="applicant"><option>田中</option><option>佐藤</option><option>大橋</option></select>
      <label>店名</label><input type="text" id="store-name"/>
      <label>日付</label><input type="date" id="receipt-date"/>
      <label>インボイス番号</label><input type="text" id="invoice-num" placeholder="T123456789012（なければ空欄）"/>
      <div style="margin-top:16px">
        <div style="font-weight:700;margin-bottom:8px">明細・勘定科目</div>
        <div id="items-container"></div>
      </div>
      <div style="background:#f9fafb;border-radius:8px;padding:12px;margin-top:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:#6b7280">消費税(8%)</span><span id="tax8">—</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:#6b7280">消費税(10%)</span><span id="tax10">—</span></div>
        <div style="display:flex;justify-content:space-between"><span style="font-weight:700">合計</span><span id="total" style="font-weight:700;font-size:16px;color:#dc2626">—</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">💰 精算方法</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button class="btn btn-green" id="btn-now" onclick="selectMethod('now')">今すぐ精算</button>
        <button class="btn btn-gray" id="btn-later" onclick="selectMethod('later')">後で精算</button>
      </div>
    </div>

    <div class="card" id="sign-section" style="display:none">
      <div class="card-title">✍️ 電子サイン</div>
      <p style="font-size:12px;color:#6b7280;margin-bottom:12px">指またはマウスで署名してください</p>
      <canvas id="sign-canvas" width="600" height="160"></canvas>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-gray btn-sm" onclick="clearSign()">クリア</button>
        <span id="sign-status" style="font-size:12px;color:#16a34a;line-height:32px;margin-left:4px"></span>
      </div>
    </div>

    <button class="btn btn-green btn-full" id="submit-btn" onclick="submitApp()" style="display:none">申請を完了する</button>
  </div>

  <div id="step3" style="display:none">
    <div style="text-align:center;padding:32px 0 16px">
      <div style="font-size:64px;margin-bottom:16px">&#x2705;</div>
      <div style="font-size:22px;font-weight:700;color:#16a34a;margin-bottom:8px">申請を受け付けました</div>
      <div style="font-size:14px;color:#6b7280">内容を確認の上、処理いたします</div>
    </div>
    <div id="result-status-msg" style="margin-bottom:16px"></div>
    <div class="app-id-box" style="margin-bottom:16px">
      <div class="label">申請ID</div>
      <div class="id" id="result-id">&#x2014;</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)">
      <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:10px">申請内容</div>
      <div id="result-summary"></div>
    </div>
    <p style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:20px">
      レシート束の一番上に申請IDを手書きで記載してください
    </p>
    <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:20px;text-align:center">
      <div style="font-size:14px;font-weight:600;color:#16a34a;margin-bottom:4px">続けて申請しますか？</div>
      <div style="font-size:12px;color:#6b7280;margin-bottom:16px">新しいレシートがあればこちらから</div>
      <button class="btn btn-green btn-full" onclick="resetApply()" style="font-size:15px;padding:14px">+ 新しい申請をする</button>
    </div>
  </div>
</div>

<!-- 顧問先 -->
<div class="page" id="page-client">
  <div class="summary-grid">
    <div class="summary-card"><div class="summary-label">今月の支出</div><div class="summary-value" style="color:#dc2626" id="c-total">—</div></div>
    <div class="summary-card"><div class="summary-label">未精算件数</div><div class="summary-value" id="c-pending">—</div></div>
  </div>
  <div class="card"><div class="card-title">📋 申請一覧</div><div id="client-list"></div></div>
</div>

<!-- 会計事務所 -->
<div class="page" id="page-accounting">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="card-title" style="margin-bottom:0">申請一覧</div>
      <button class="btn btn-blue btn-sm" onclick="downloadCSV()">⬇ CSV出力</button>
    </div>
    <div id="accounting-list"></div>
  </div>
</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title"><span>申請詳細</span><button style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280" onclick="closeModal()">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let apps = JSON.parse(localStorage.getItem('cash_apps')||'[]');
let cur = null, payMethod = null, b64 = null, mime = null, signHasData = false;

const ACCOUNTS = ['会議費','交際費','旅費交通費','消耗品費','事務用品費','通信費','新聞図書費','厚生費','雑費'];
const AMAP = {'弁当':'会議費','サンドイッチ':'会議費','おにぎり':'会議費','お茶':'厚生費','コーヒー':'厚生費','飲料':'厚生費','ティッシュ':'消耗品費','洗剤':'消耗品費','ボールペン':'事務用品費','ノート':'事務用品費','電車':'旅費交通費','バス':'旅費交通費','タクシー':'旅費交通費','切手':'通信費','書籍':'新聞図書費','雑誌':'新聞図書費'};

function guessAccount(n){for(const[k,v]of Object.entries(AMAP))if(n.includes(k))return v;return '雑費';}
function genId(){const d=new Date();return `CS-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}-${String(apps.length+1).padStart(6,'0')}`;}
function save(){localStorage.setItem('cash_apps',JSON.stringify(apps));}

function showPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='client')renderClient();
  if(id==='accounting')renderAccounting();
}

function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  mime=file.type;
  const r=new FileReader();
  r.onload=e=>{
    b64=e.target.result.split(',')[1];
    document.getElementById('preview').src=e.target.result;
    document.getElementById('preview-wrap').style.display='block';
    document.getElementById('analyze-btn').style.display='block';
  };
  r.readAsDataURL(file);
}

async function analyzeReceipt(){
  if(!b64){alert('レシートを選択してください');return;}
  document.getElementById('step1').innerHTML='<div class="loading"><div class="spinner"></div><div>Claudeが解析中…</div></div>';
  try{
    const res=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64,mimeType:mime})
    });
    if(!res.ok){const e=await res.json();throw new Error(e.error||res.status);}
    cur=await res.json();
    renderStep2();
  }catch(e){
    document.getElementById('step1').innerHTML=`<div class="card"><div class="card-title" style="color:#dc2626">⚠ エラー</div><p style="font-size:13px;color:#6b7280">${e.message}</p><button class="btn btn-gray btn-full" onclick="location.reload()">やり直す</button></div>`;
  }
}

function renderStep2(){
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('store-name').value=cur.store_name||'';
  document.getElementById('receipt-date').value=cur.date||'';
  document.getElementById('invoice-num').value=cur.invoice_number||'';
  document.getElementById('tax8').textContent=cur.tax_8!=null?`¥${cur.tax_8.toLocaleString()}`:'—';
  document.getElementById('tax10').textContent=cur.tax_10!=null?`¥${cur.tax_10.toLocaleString()}`:'—';
  document.getElementById('total').textContent=cur.total!=null?`¥${cur.total.toLocaleString()}`:'—';
  const c=document.getElementById('items-container');
  c.innerHTML='';
  (cur.items||[]).forEach((item,i)=>{
    const ac=guessAccount(item.name);
    const opts=ACCOUNTS.map(a=>`<option${a===ac?' selected':''}>${a}</option>`).join('');
    c.innerHTML+=`<div class="item-row">
      <div class="item-header"><span style="font-weight:600">${item.name}</span><span style="font-weight:700;color:#16a34a">¥${Number(item.amount||0).toLocaleString()}</span></div>
      <span class="badge-blue">${item.tax_category||'不明'}</span>
      <select id="ac-${i}" style="margin-top:8px;width:100%;padding:6px 8px;font-size:12px;border:1px solid #e5e7eb;border-radius:6px">${opts}</select>
    </div>`;
  });
}

function selectMethod(m){
  payMethod=m;
  document.getElementById('btn-now').style.opacity=m==='now'?'1':'0.5';
  document.getElementById('btn-later').style.opacity=m==='later'?'1':'0.5';
  document.getElementById('sign-section').style.display=m==='now'?'block':'none';
  if(m==='now')initCanvas();
  // 精算方法を選んだら申請ボタンを表示
  const btn = document.getElementById('submit-btn');
  btn.style.display='block';
  btn.disabled=false;
  btn.textContent='申請を完了する';
  btn.style.opacity='1';
  btn.style.cursor='pointer';
  isSubmitting=false;
}

let isDrawing=false;
function initCanvas(){
  const cv=document.getElementById('sign-canvas');
  const r=cv.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio;cv.height=160*devicePixelRatio;cv.style.height='160px';
  const ctx=cv.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.strokeStyle='#1c1917';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  const pos=e=>{const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};};
  cv.onmousedown=cv.ontouchstart=e=>{e.preventDefault();isDrawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  cv.onmousemove=cv.ontouchmove=e=>{e.preventDefault();if(!isDrawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();signHasData=true;document.getElementById('sign-status').textContent='署名済み ✓';};
  cv.onmouseup=cv.ontouchend=()=>{isDrawing=false;};
}
function clearSign(){const cv=document.getElementById('sign-canvas');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);signHasData=false;document.getElementById('sign-status').textContent='';}

let isSubmitting = false;
function submitApp(){
  if(isSubmitting) return;
  if(!payMethod){alert('精算方法を選択してください');return;}
  if(payMethod==='now'&&!signHasData){alert('電子サインを記入してください');return;}

  // ボタンを即座に無効化
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中…';
  btn.style.opacity = '0.5';
  btn.style.cursor = 'not-allowed';
  isSubmitting = true;

  const applicant = document.getElementById('applicant').value;
  const total = cur.total != null ? `¥${cur.total.toLocaleString()}` : '不明';
  const statusText = payMethod==='now' ? '今すぐ精算' : '後で精算';

  showConfirmModal(`
    <div style="text-align:center;margin-bottom:16px;font-size:32px">📋</div>
    <div style="font-size:16px;font-weight:700;text-align:center;margin-bottom:16px">申請内容を確認してください</div>
    <div style="background:#f9fafb;border-radius:8px;padding:14px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#6b7280">申請者</span><b>${applicant}</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#6b7280">合計金額</span><b style="color:#dc2626">${total}</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:#6b7280">精算方法</span><b>${statusText}</b></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-gray" onclick="cancelSubmit()">戻る</button>
      <button class="btn btn-green" onclick="doSubmit()">申請する</button>
    </div>
  `);
}

function cancelSubmit(){
  // 戻るを押したらボタンを復活
  isSubmitting = false;
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.textContent = '申請を完了する';
  btn.style.opacity = '1';
  btn.style.cursor = 'pointer';
  closeConfirmModal();
}

function doSubmit(){
  closeConfirmModal();

  const items=(cur.items||[]).map((item,i)=>({...item,account:document.getElementById('ac-'+i)?.value||'雑費'}));
  const app={id:genId(),date:document.getElementById('receipt-date').value,applicant:document.getElementById('applicant').value,store_name:document.getElementById('store-name').value,invoice_number:document.getElementById('invoice-num').value,items,tax_8:cur.tax_8,tax_10:cur.tax_10,total:cur.total,pay_method:payMethod,status:payMethod==='now'?'精算済':'未精算',sign:payMethod==='now'?document.getElementById('sign-canvas').toDataURL():null,receipt_img:b64?`data:${mime};base64,${b64}`:null,created_at:new Date().toISOString()};
  apps.push(app);save();

  // 完了画面に表示
  document.getElementById('result-id').textContent = app.id;
  document.getElementById('result-status-msg').innerHTML = payMethod==='now'
    ? '<div style="background:#dcfce7;color:#16a34a;border-radius:8px;padding:12px;text-align:center;font-weight:600">✓ 今すぐ精算済みとして記録されました</div>'
    : '<div style="background:#fef3c7;color:#d97706;border-radius:8px;padding:12px;text-align:center;font-weight:600">⏳ 未精算として記録されました（後で精算）</div>';
  document.getElementById('result-summary').innerHTML = `
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:#6b7280">申請者</span><b>${app.applicant}</b></div>
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:#6b7280">店名</span><b>${app.store_name||'—'}</b></div>
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:#6b7280">日付</span><b>${app.date||'—'}</b></div>
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:#6b7280">合計金額</span><b style="color:#dc2626;font-size:15px">${app.total!=null?'¥'+app.total.toLocaleString():'—'}</b></div>
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:#6b7280">明細</span><b>${app.items.length}件</b></div>
  `;

  // 完了画面へ遷移
  document.getElementById('step2').style.display='none';
  document.getElementById('step3').style.display='block';
  window.scrollTo(0,0);
}

function resetApply(){
  // 状態をリセットして申請画面に戻る
  cur = null; payMethod = null; b64 = null; mime = null; signHasData = false; isSubmitting = false;
  document.getElementById('step2').style.display='none';
  document.getElementById('step3').style.display='none';
  document.getElementById('step1').style.display='block';
  document.getElementById('step1').innerHTML = `
    <div class="card-title">&#x1F4F7; レシートをアップロード</div>
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="event.preventDefault();this.classList.remove('drag');handleFile(event.dataTransfer.files[0])">
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this.files[0])"/>
      <div style="font-size:36px;margin-bottom:8px">&#x1F9FE;</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">タップして選択</div>
      <div style="font-size:12px;color:#9ca3af">JPG&#x30FB;PNG&#x30FB;HEIC対応</div>
    </div>
    <div id="preview-wrap" style="display:none"><img id="preview" class="preview-img"/></div>
    <button class="btn btn-green btn-full" id="analyze-btn" style="display:none" onclick="analyzeReceipt()">&#x1F50D; AIで解析する</button>
  `;
  window.scrollTo(0,0);
}

function showConfirmModal(html){
  let el = document.getElementById('confirm-modal');
  if(!el){
    el = document.createElement('div');
    el.id = 'confirm-modal';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    el.innerHTML = '<div id="confirm-inner" style="background:#fff;border-radius:16px;width:100%;max-width:400px;padding:24px"></div>';
    document.body.appendChild(el);
  }
  document.getElementById('confirm-inner').innerHTML = html;
  el.style.display = 'flex';
}

function closeConfirmModal(){
  const el = document.getElementById('confirm-modal');
  if(el) el.style.display = 'none';
}

function renderClient(){
  const total=apps.reduce((s,a)=>s+(a.total||0),0);
  const pending=apps.filter(a=>a.status==='未精算').length;
  document.getElementById('c-total').textContent=`¥${total.toLocaleString()}`;
  document.getElementById('c-pending').textContent=`${pending}件`;
  const list=document.getElementById('client-list');
  if(!apps.length){list.innerHTML='<p style="color:#9ca3af;text-align:center;padding:24px">申請はありません</p>';return;}
  list.innerHTML=apps.slice().reverse().map(a=>`<div class="list-item" onclick="showDetail('${a.id}')">
    <div class="list-header"><div><div style="font-size:12px;color:#9ca3af">${a.date} ${a.store_name}</div><div style="font-weight:600">${a.applicant}</div></div>
    <div style="text-align:right"><div class="list-amount">-¥${(a.total||0).toLocaleString()}</div><span class="status-badge ${a.status==='精算済'?'status-done':'status-pending'}">${a.status}</span></div></div>
    <div style="font-size:12px;color:#9ca3af;margin-top:4px">${a.id}</div>
  </div>`).join('');
}

function renderAccounting(){
  const list=document.getElementById('accounting-list');
  if(!apps.length){list.innerHTML='<p style="color:#9ca3af;text-align:center;padding:24px">申請はありません</p>';return;}
  list.innerHTML=apps.slice().reverse().map(a=>`<div class="list-item" onclick="showDetail('${a.id}')">
    <div class="list-header"><div><div style="font-size:12px;color:#9ca3af">${a.date}</div><div style="font-weight:600">${a.applicant} · ${a.store_name}</div></div>
    <div style="text-align:right"><div class="list-amount">¥${(a.total||0).toLocaleString()}</div><span class="status-badge ${a.status==='精算済'?'status-done':'status-pending'}">${a.status}</span></div></div>
    <div style="font-size:12px;color:#9ca3af;margin-top:4px">${a.id} · ${(a.items||[]).length}件</div>
  </div>`).join('');
}

function showDetail(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  const rows=(a.items||[]).map(it=>`<tr><td>${it.name}</td><td>${it.account||'—'}</td><td>${it.tax_category||'—'}</td><td style="text-align:right">¥${Number(it.amount||0).toLocaleString()}</td></tr>`).join('');
  document.getElementById('modal-body').innerHTML=`
    <div class="app-id-box"><div class="label">申請ID</div><div class="id">${a.id}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:13px">
      <div><span style="color:#9ca3af">申請者</span><br><b>${a.applicant}</b></div>
      <div><span style="color:#9ca3af">日付</span><br><b>${a.date}</b></div>
      <div><span style="color:#9ca3af">店名</span><br><b>${a.store_name||'—'}</b></div>
      <div><span style="color:#9ca3af">インボイス</span><br><b>${a.invoice_number||'なし'}</b></div>
    </div>
    <table class="csv-table"><thead><tr><th>商品名</th><th>勘定科目</th><th>税区分</th><th>金額</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="text-align:right;margin-top:8px;font-size:15px;font-weight:700">合計: ¥${(a.total||0).toLocaleString()}</div>
    ${a.sign&&a.sign!=='手動精算（サインなし）'?`<hr style="margin:16px 0"/><div style="font-size:12px;font-weight:600;color:#6b7280;margin-bottom:8px">電子サイン</div><img src="${a.sign}" style="border:1px solid #e5e7eb;border-radius:8px;width:100%;max-height:120px;object-fit:contain;background:#fafafa"/>`:''}
    ${a.receipt_img?`<hr style="margin:16px 0"/><div style="font-size:12px;font-weight:600;color:#6b7280;margin-bottom:8px">レシート画像</div><img src="${a.receipt_img}" style="width:100%;border-radius:8px"/>`:''}
    ${a.status==='未精算'?`<button class="btn btn-green btn-full" style="margin-top:16px" onclick="completePayment('${a.id}')">現金精算を完了する</button>`:''}
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

function completePayment(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  a.status='精算済';save();closeModal();renderClient();renderAccounting();alert('精算完了しました');
}

function downloadCSV(){
  if(!apps.length){alert('申請データがありません');return;}
  const h=['日付','摘要','出金','入金','申請ID','申請者','インボイス番号'];
  const esc=v=>{const s=String(v??'');return /[,"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:`${s}`;};
  const rows=[];
  apps.forEach(a=>{
    (a.items||[]).forEach(item=>{
      rows.push([a.date,`${item.account||'雑費'} ${item.name}`,item.amount||0,'',a.id,a.applicant,a.invoice_number||'']);
    });
  });
  const csv='\uFEFF'+[h,...rows].map(r=>r.map(esc).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`現金出納帳_${new Date().toISOString().slice(0,10)}.csv`}).click();
}
</script>
