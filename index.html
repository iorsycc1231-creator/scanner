<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>現金精算アプリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f0f4f8;min-height:100vh;font-size:14px}
nav{background:#1c1917;color:#fff;padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.nav-logo{font-size:15px;font-weight:700;padding:14px 0;margin-right:16px;white-space:nowrap}
.nav-tab{padding:14px 12px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;color:#9ca3af;transition:all .2s;white-space:nowrap}
.nav-tab.active{color:#fff;border-bottom-color:#16a34a}
.page{display:none;padding:20px 16px 80px;max-width:800px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;color:#1c1917}
label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px;margin-top:12px}
label:first-child{margin-top:0}
input,select{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#16a34a}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-green{background:#16a34a;color:#fff}
.btn-gray{background:#f3f4f6;color:#374151}
.btn-blue{background:#2563eb;color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%;margin-top:12px;padding:14px}
.upload-zone{border:2px dashed #d1d5db;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer}
.preview-img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:12px}
.item-row{background:#f9fafb;border-radius:8px;padding:12px;margin-bottom:8px}
.item-header{display:flex;justify-content:space-between;margin-bottom:6px}
.badge-blue{background:#dbeafe;color:#2563eb;border-radius:4px;padding:2px 8px;font-size:11px;display:inline-block}
.loading{text-align:center;padding:32px;color:#6b7280}
.spinner{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#16a34a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.method-btn{padding:14px;border:2px solid #e5e7eb;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.method-btn.selected-now{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
.method-btn.selected-later{border-color:#d97706;background:#fffbeb;color:#d97706}
#sign-canvas{border:2px solid #e5e7eb;border-radius:8px;width:100%;touch-action:none;cursor:crosshair;background:#fafafa}
.appid-box{background:#1c1917;color:#fff;border-radius:10px;padding:16px;text-align:center}
.appid-box .label{font-size:11px;color:#9ca3af;margin-bottom:6px}
.appid-box .id{font-size:20px;font-weight:700;letter-spacing:2px}
.list-item{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.list-row{display:flex;justify-content:space-between;align-items:center}
.status-done{background:#dcfce7;color:#16a34a;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.status-pending{background:#fef3c7;color:#d97706;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.summary-card{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto;padding:20px}
.modal-bg.open{display:block}
.modal{background:#fff;border-radius:16px;max-width:500px;margin:0 auto;padding:24px}
.data-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.data-row .l{color:#6b7280}
hr{border:none;border-top:1px solid #e5e7eb;margin:10px 0}
.csv-table{width:100%;border-collapse:collapse;font-size:12px}
.csv-table th{background:#f3f4f6;padding:8px;text-align:left;border:1px solid #e5e7eb;font-weight:600}
.csv-table td{padding:8px;border:1px solid #e5e7eb}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">💴 現金精算</div>
  <div class="nav-tab active" id="tab-apply" onclick="showPage('apply')">申請</div>
  <div class="nav-tab" id="tab-client" onclick="showPage('client')">顧問先</div>
  <div class="nav-tab" id="tab-accounting" onclick="showPage('accounting')">会計事務所</div>
</nav>

<!-- 申請ページ -->
<div class="page active" id="page-apply">

  <!-- STEP1: アップロード -->
  <div id="step1">
    <div class="card">
      <div class="card-title">📷 レシートをアップロード</div>
      <div class="upload-zone" onclick="document.getElementById('filein').click()">
        <input type="file" id="filein" accept="image/*" style="display:none" onchange="onFile(this.files[0])"/>
        <div style="font-size:36px;margin-bottom:8px">🧾</div>
        <div style="font-weight:700;margin-bottom:4px">タップして選択</div>
        <div style="font-size:12px;color:#9ca3af">JPG・PNG・HEIC対応</div>
      </div>
      <div id="preview-wrap" style="display:none">
        <img id="preview" class="preview-img"/>
      </div>
      <button class="btn btn-green btn-full" id="analyze-btn" style="display:none" onclick="analyze()">
        🔍 AIで解析する
      </button>
    </div>
  </div>

  <!-- STEP2: 編集・申請 -->
  <div id="step2" style="display:none">
    <div class="card">
      <div class="card-title">📋 解析結果・編集</div>
      <label>精算者</label>
      <select id="f-applicant">
        <option>田中</option><option>佐藤</option><option>大橋</option>
      </select>
      <label>店名</label>
      <input type="text" id="f-store"/>
      <label>日付</label>
      <input type="date" id="f-date"/>
      <label>インボイス番号</label>
      <input type="text" id="f-invoice" placeholder="T123456789012（なければ空欄）"/>
      <div style="margin-top:16px;font-weight:700;font-size:14px;margin-bottom:8px">明細・勘定科目</div>
      <div id="items-wrap"></div>
      <div style="background:#f9fafb;border-radius:8px;padding:12px;margin-top:8px">
        <div class="data-row"><span class="l">消費税(8%)</span><span id="d-tax8">—</span></div>
        <div class="data-row"><span class="l">消費税(10%)</span><span id="d-tax10">—</span></div>
        <div class="data-row"><span class="l" style="font-weight:700">合計</span><span id="d-total" style="font-weight:700;font-size:16px;color:#dc2626">—</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">💰 精算方法を選択</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="method-btn" id="btn-now" onclick="selectMethod('now')">
          今すぐ精算
        </button>
        <button class="method-btn" id="btn-later" onclick="selectMethod('later')">
          後で精算
        </button>
      </div>
    </div>

    <div class="card" id="sign-card" style="display:none">
      <div class="card-title">✍️ 電子サイン</div>
      <p style="font-size:12px;color:#6b7280;margin-bottom:10px">指またはマウスで署名してください</p>
      <canvas id="sign-canvas" height="160"></canvas>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button class="btn btn-gray btn-sm" onclick="clearSign()">クリア</button>
        <span id="sign-ok" style="font-size:12px;color:#16a34a;display:none">✓ 署名済み</span>
      </div>
    </div>

    <button class="btn btn-green btn-full" id="submit-btn" style="display:none" onclick="onSubmit()">
      申請を完了する
    </button>
  </div>

  <!-- STEP3: 完了 -->
  <div id="step3" style="display:none">
    <div style="text-align:center;padding:40px 0 24px">
      <div style="font-size:60px;margin-bottom:16px">✅</div>
      <div style="font-size:22px;font-weight:700;color:#16a34a;margin-bottom:6px">申請を受け付けました</div>
      <div style="font-size:14px;color:#6b7280">内容を確認の上、処理いたします</div>
    </div>

    <div id="s3-status" style="margin-bottom:12px"></div>

    <div class="appid-box" style="margin-bottom:16px">
      <div class="label">申請ID</div>
      <div class="id" id="s3-id">—</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:10px">申請内容</div>
      <div id="s3-summary"></div>
    </div>

    <p style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:20px">
      📝 レシート束の一番上に申請IDを手書きで記載してください
    </p>

    <div style="background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:24px;text-align:center">
      <div style="font-size:15px;font-weight:700;color:#16a34a;margin-bottom:6px">続けて申請できます</div>
      <div style="font-size:13px;color:#6b7280;margin-bottom:16px">新しいレシートがあればこちらから</div>
      <button class="btn btn-green btn-full" onclick="goNewApply()" style="font-size:15px">
        ＋ 新しい申請をする
      </button>
    </div>
  </div>
</div>

<!-- 顧問先 -->
<div class="page" id="page-client">
  <div class="summary-grid">
    <div class="summary-card">
      <div style="font-size:11px;color:#9ca3af;margin-bottom:4px">今月の支出</div>
      <div style="font-size:22px;font-weight:700;color:#dc2626" id="c-total">¥0</div>
    </div>
    <div class="summary-card">
      <div style="font-size:11px;color:#9ca3af;margin-bottom:4px">未精算件数</div>
      <div style="font-size:22px;font-weight:700" id="c-pending">0件</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📋 申請一覧</div>
    <div id="client-list"></div>
  </div>
</div>

<!-- 会計事務所 -->
<div class="page" id="page-accounting">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="card-title" style="margin-bottom:0">申請一覧</div>
      <button class="btn btn-blue btn-sm" onclick="dlCSV()">⬇ CSV出力</button>
    </div>
    <div id="acc-list"></div>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <span style="font-size:17px;font-weight:700">申請詳細</span>
      <button style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── データ ──────────────────────────────
var apps = JSON.parse(localStorage.getItem('cash_apps') || '[]');
var curData = null;
var payMethod = null;
var imgB64 = null;
var imgMime = null;
var signDone = false;
var submitting = false;

var ACCOUNTS = ['会議費','交際費','旅費交通費','消耗品費','事務用品費','通信費','新聞図書費','厚生費','雑費'];
var AMAP = {
  '弁当':'会議費','サンドイッチ':'会議費','おにぎり':'会議費',
  'お茶':'厚生費','コーヒー':'厚生費','飲料':'厚生費',
  'ティッシュ':'消耗品費','洗剤':'消耗品費',
  'ボールペン':'事務用品費','ノート':'事務用品費',
  '電車':'旅費交通費','バス':'旅費交通費','タクシー':'旅費交通費',
  '切手':'通信費','書籍':'新聞図書費'
};

function guessAcc(name) {
  for (var k in AMAP) { if (name.indexOf(k) >= 0) return AMAP[k]; }
  return '雑費';
}

function genId() {
  var d = new Date();
  var ym = d.getFullYear() + '' + ('0'+(d.getMonth()+1)).slice(-2);
  return 'CS-' + ym + '-' + ('000000' + (apps.length + 1)).slice(-6);
}

function saveApps() { localStorage.setItem('cash_apps', JSON.stringify(apps)); }

// ── ページ切替 ──────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('page-' + id).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'client') renderClient();
  if (id === 'accounting') renderAcc();
}

// ── ファイル処理 ────────────────────────
function onFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  imgMime = file.type;
  var r = new FileReader();
  r.onload = function(e) {
    imgB64 = e.target.result.split(',')[1];
    document.getElementById('preview').src = e.target.result;
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('analyze-btn').style.display = 'block';
  };
  r.readAsDataURL(file);
}

// ── AI解析 ──────────────────────────────
function analyze() {
  if (!imgB64) return;
  document.getElementById('step1').innerHTML =
    '<div class="loading"><div class="spinner"></div><div>Claudeが解析中…</div></div>';

  fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: imgB64, mimeType: imgMime })
  })
  .then(function(res) {
    if (!res.ok) return res.json().then(function(e){ throw new Error(e.error || res.status); });
    return res.json();
  })
  .then(function(data) {
    curData = data;
    renderStep2();
  })
  .catch(function(e) {
    document.getElementById('step1').innerHTML =
      '<div class="card"><div class="card-title" style="color:#dc2626">⚠ エラー</div>' +
      '<p style="font-size:13px;color:#6b7280;margin-bottom:12px">' + e.message + '</p>' +
      '<button class="btn btn-gray btn-full" onclick="location.reload()">やり直す</button></div>';
  });
}

function renderStep2() {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('f-store').value = curData.store_name || '';
  document.getElementById('f-date').value = curData.date || '';
  document.getElementById('f-invoice').value = curData.invoice_number || '';
  document.getElementById('d-tax8').textContent = curData.tax_8 != null ? '¥' + curData.tax_8.toLocaleString() : '—';
  document.getElementById('d-tax10').textContent = curData.tax_10 != null ? '¥' + curData.tax_10.toLocaleString() : '—';
  document.getElementById('d-total').textContent = curData.total != null ? '¥' + curData.total.toLocaleString() : '—';

  var wrap = document.getElementById('items-wrap');
  wrap.innerHTML = '';
  (curData.items || []).forEach(function(item, i) {
    var ac = guessAcc(item.name);
    var opts = ACCOUNTS.map(function(a) {
      return '<option' + (a === ac ? ' selected' : '') + '>' + a + '</option>';
    }).join('');
    wrap.innerHTML +=
      '<div class="item-row">' +
        '<div class="item-header">' +
          '<span style="font-weight:600">' + item.name + '</span>' +
          '<span style="font-weight:700;color:#16a34a">¥' + Number(item.amount||0).toLocaleString() + '</span>' +
        '</div>' +
        '<span class="badge-blue">' + (item.tax_category||'不明') + '</span>' +
        '<select id="ac-' + i + '" style="margin-top:8px;width:100%;padding:6px 8px;font-size:12px;border:1px solid #e5e7eb;border-radius:6px">' + opts + '</select>' +
      '</div>';
  });
}

// ── 精算方法 ────────────────────────────
function selectMethod(m) {
  payMethod = m;
  var btnNow = document.getElementById('btn-now');
  var btnLater = document.getElementById('btn-later');
  btnNow.className = 'method-btn' + (m === 'now' ? ' selected-now' : '');
  btnLater.className = 'method-btn' + (m === 'later' ? ' selected-later' : '');

  var signCard = document.getElementById('sign-card');
  signCard.style.display = m === 'now' ? 'block' : 'none';
  if (m === 'now') initCanvas();

  var submitBtn = document.getElementById('submit-btn');
  submitBtn.style.display = 'block';
  submitBtn.disabled = false;
  submitBtn.textContent = '申請を完了する';
  submitBtn.style.opacity = '1';
  submitting = false;
}

// ── 電子サイン ───────────────────────────
var drawing = false;
function initCanvas() {
  var cv = document.getElementById('sign-canvas');
  var w = cv.parentElement.clientWidth - 40;
  cv.width = w;
  cv.height = 160;
  var ctx = cv.getContext('2d');
  ctx.strokeStyle = '#1c1917';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';

  function getPos(e) {
    var r = cv.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  cv.onmousedown = cv.ontouchstart = function(e) {
    e.preventDefault(); drawing = true;
    var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
  };
  cv.onmousemove = cv.ontouchmove = function(e) {
    e.preventDefault();
    if (!drawing) return;
    var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
    signDone = true;
    document.getElementById('sign-ok').style.display = 'inline';
  };
  cv.onmouseup = cv.ontouchend = function() { drawing = false; };
}

function clearSign() {
  var cv = document.getElementById('sign-canvas');
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  signDone = false;
  document.getElementById('sign-ok').style.display = 'none';
}

// ── 申請処理 ────────────────────────────
function onSubmit() {
  if (submitting) return;
  if (!payMethod) { alert('精算方法を選択してください'); return; }
  if (payMethod === 'now' && !signDone) { alert('電子サインを記入してください'); return; }

  var applicant = document.getElementById('f-applicant').value;
  var total = curData.total != null ? '¥' + curData.total.toLocaleString() : '不明';
  var methodLabel = payMethod === 'now' ? '今すぐ精算' : '後で精算';

  submitting = true;
  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '処理中…';
  btn.style.opacity = '0.5';

  var items = (curData.items || []).map(function(item, i) {
    return Object.assign({}, item, { account: document.getElementById('ac-' + i) ? document.getElementById('ac-' + i).value : '雑費' });
  });

  var signData = (payMethod === 'now') ? document.getElementById('sign-canvas').toDataURL() : null;

  var app = {
    id: genId(),
    date: document.getElementById('f-date').value,
    applicant: applicant,
    store_name: document.getElementById('f-store').value,
    invoice_number: document.getElementById('f-invoice').value,
    items: items,
    tax_8: curData.tax_8,
    tax_10: curData.tax_10,
    total: curData.total,
    pay_method: payMethod,
    status: payMethod === 'now' ? '精算済' : '未精算',
    sign: signData,
    receipt_img: imgB64 ? 'data:' + imgMime + ';base64,' + imgB64 : null,
    created_at: new Date().toISOString()
  };

  apps.push(app);
  saveApps();
  showStep3(app);
}

function showStep3(app) {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'block';
  window.scrollTo(0, 0);

  document.getElementById('s3-id').textContent = app.id;

  document.getElementById('s3-status').innerHTML = app.status === '精算済'
    ? '<div style="background:#dcfce7;color:#16a34a;border-radius:8px;padding:12px;text-align:center;font-weight:600">✓ 今すぐ精算済みとして記録されました</div>'
    : '<div style="background:#fef3c7;color:#d97706;border-radius:8px;padding:12px;text-align:center;font-weight:600">⏳ 未精算として記録されました（後で精算）</div>';

  document.getElementById('s3-summary').innerHTML =
    '<div class="data-row"><span class="l">申請者</span><b>' + app.applicant + '</b></div>' +
    '<div class="data-row"><span class="l">店名</span><b>' + (app.store_name||'—') + '</b></div>' +
    '<div class="data-row"><span class="l">日付</span><b>' + (app.date||'—') + '</b></div>' +
    '<div class="data-row"><span class="l">明細件数</span><b>' + app.items.length + '件</b></div>' +
    '<div class="data-row"><span class="l">合計金額</span><b style="color:#dc2626;font-size:16px">' + (app.total != null ? '¥'+app.total.toLocaleString() : '—') + '</b></div>';
}

function goNewApply() {
  curData = null; payMethod = null; imgB64 = null; imgMime = null; signDone = false; submitting = false;
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'none';
  document.getElementById('step1').style.display = 'block';
  document.getElementById('step1').innerHTML =
    '<div class="card">' +
    '<div class="card-title">📷 レシートをアップロード</div>' +
    '<div class="upload-zone" onclick="document.getElementById(\'filein\').click()">' +
    '<input type="file" id="filein" accept="image/*" style="display:none" onchange="onFile(this.files[0])"/>' +
    '<div style="font-size:36px;margin-bottom:8px">🧾</div>' +
    '<div style="font-weight:700;margin-bottom:4px">タップして選択</div>' +
    '<div style="font-size:12px;color:#9ca3af">JPG・PNG・HEIC対応</div>' +
    '</div>' +
    '<div id="preview-wrap" style="display:none"><img id="preview" class="preview-img"/></div>' +
    '<button class="btn btn-green btn-full" id="analyze-btn" style="display:none" onclick="analyze()">🔍 AIで解析する</button>' +
    '</div>';
  window.scrollTo(0, 0);
}

// ── 顧問先 ──────────────────────────────
function renderClient() {
  var total = apps.reduce(function(s,a){ return s+(a.total||0); }, 0);
  var pending = apps.filter(function(a){ return a.status==='未精算'; }).length;
  document.getElementById('c-total').textContent = '¥' + total.toLocaleString();
  document.getElementById('c-pending').textContent = pending + '件';
  var el = document.getElementById('client-list');
  if (!apps.length) { el.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:24px">申請はありません</p>'; return; }
  el.innerHTML = apps.slice().reverse().map(function(a) {
    return '<div class="list-item" onclick="showDetail(\'' + a.id + '\')">' +
      '<div class="list-row">' +
        '<div><div style="font-size:12px;color:#9ca3af">' + a.date + ' ' + a.store_name + '</div>' +
        '<div style="font-weight:600;margin-top:2px">' + a.applicant + '</div></div>' +
        '<div style="text-align:right">' +
          '<div style="font-weight:700;color:#dc2626;font-size:16px">-¥' + (a.total||0).toLocaleString() + '</div>' +
          '<span class="' + (a.status==='精算済'?'status-done':'status-pending') + '">' + a.status + '</span>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:#9ca3af;margin-top:6px">' + a.id + '</div>' +
    '</div>';
  }).join('');
}

// ── 会計事務所 ───────────────────────────
function renderAcc() {
  var el = document.getElementById('acc-list');
  if (!apps.length) { el.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:24px">申請はありません</p>'; return; }
  el.innerHTML = apps.slice().reverse().map(function(a) {
    return '<div class="list-item" onclick="showDetail(\'' + a.id + '\')">' +
      '<div class="list-row">' +
        '<div><div style="font-size:12px;color:#9ca3af">' + a.date + '</div>' +
        '<div style="font-weight:600;margin-top:2px">' + a.applicant + ' · ' + a.store_name + '</div></div>' +
        '<div style="text-align:right">' +
          '<div style="font-weight:700;color:#dc2626;font-size:16px">¥' + (a.total||0).toLocaleString() + '</div>' +
          '<span class="' + (a.status==='精算済'?'status-done':'status-pending') + '">' + a.status + '</span>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:#9ca3af;margin-top:6px">' + a.id + ' · ' + (a.items||[]).length + '件</div>' +
    '</div>';
  }).join('');
}

// ── 詳細モーダル ─────────────────────────
function showDetail(id) {
  var a = apps.find(function(x){ return x.id === id; });
  if (!a) return;
  var rows = (a.items||[]).map(function(it) {
    return '<tr><td>' + it.name + '</td><td>' + (it.account||'—') + '</td><td>' + (it.tax_category||'—') + '</td><td style="text-align:right">¥' + Number(it.amount||0).toLocaleString() + '</td></tr>';
  }).join('');

  document.getElementById('modal-body').innerHTML =
    '<div class="appid-box" style="margin-bottom:16px"><div class="label">申請ID</div><div class="id">' + a.id + '</div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:13px">' +
      '<div><span style="color:#9ca3af">申請者</span><br><b>' + a.applicant + '</b></div>' +
      '<div><span style="color:#9ca3af">日付</span><br><b>' + a.date + '</b></div>' +
      '<div><span style="color:#9ca3af">店名</span><br><b>' + (a.store_name||'—') + '</b></div>' +
      '<div><span style="color:#9ca3af">インボイス</span><br><b>' + (a.invoice_number||'なし') + '</b></div>' +
    '</div>' +
    '<table class="csv-table"><thead><tr><th>商品名</th><th>勘定科目</th><th>税区分</th><th>金額</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="text-align:right;margin-top:8px;font-size:15px;font-weight:700">合計: ¥' + (a.total||0).toLocaleString() + '</div>' +
    (a.sign && a.sign.startsWith('data:') ? '<hr/><div style="font-size:12px;font-weight:600;color:#6b7280;margin-bottom:8px">電子サイン</div><img src="' + a.sign + '" style="border:1px solid #e5e7eb;border-radius:8px;width:100%;max-height:120px;object-fit:contain;background:#fafafa"/>' : '') +
    (a.receipt_img ? '<hr/><div style="font-size:12px;font-weight:600;color:#6b7280;margin-bottom:8px">レシート画像</div><img src="' + a.receipt_img + '" style="width:100%;border-radius:8px"/>' : '') +
    (a.status==='未精算' ? '<button class="btn btn-green btn-full" style="margin-top:16px" onclick="completePayment(\'' + a.id + '\')">現金精算を完了する</button>' : '');

  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

function completePayment(id) {
  var a = apps.find(function(x){ return x.id === id; });
  if (!a) return;
  a.status = '精算済';
  saveApps();
  closeModal();
  renderClient();
  renderAcc();
  alert('精算完了しました');
}

// ── CSV出力 ──────────────────────────────
function dlCSV() {
  if (!apps.length) { alert('申請データがありません'); return; }
  var h = ['日付','摘要','出金','入金','申請ID','申請者','インボイス番号'];
  function esc(v) { var s = String(v == null ? '' : v); return (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  var rows = [];
  apps.forEach(function(a) {
    (a.items||[]).forEach(function(item) {
      rows.push([a.date, (item.account||'雑費')+' '+item.name, item.amount||0, '', a.id, a.applicant, a.invoice_number||'']);
    });
  });
  var csv = '\uFEFF' + [h].concat(rows).map(function(r){ return r.map(esc).join(','); }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '現金出納帳_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}
</script>
</body>
</html>
